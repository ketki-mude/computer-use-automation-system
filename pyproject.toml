[project]
name = "ui-automation"
version = "0.1.0"
description = "Computer-use automation for legacy apps: an LLM learns a task once, deterministic replay repeats it"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "google-genai>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# The pixel surface (no DOM): OCR that installs with pip alone, on Windows, macOS and Linux.
pixel = ["rapidocr>=3", "onnxruntime>=1.17"]

[project.scripts]
ui-automation = "ui_automation.command_line:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ui_automation*", "mock_bank*"]

[tool.setuptools.package-data]
ui_automation = ["screen/*.js", "human_handoff/*.js", "web/templates/*.html", "web/static/*"]
mock_bank = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as call defaults; they are evaluated once and never mutated.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# Pydantic copies field defaults per instance, so `= []` / `= {}` defaults are safe in models.
"src/ui_automation/models/*" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: drives a real browser against the in-process mock bank (about 2 minutes)"]

[project]
name = "cua"
version = "0.1.0"
description = "Computer-use automation: LLM discovery -> typed capability artifacts -> deterministic replay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
cua = "cua.cli:app"
mockbank = "mockbank.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cua*", "mockbank*"]

[tool.setuptools.package-data]
mockbank = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as call defaults; they are evaluated once and never mutated.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

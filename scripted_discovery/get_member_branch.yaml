# Offline demo script: lets the control room show "new request -> learn it -> approve -> reuse"
# without an API key. Chosen when the AI is unavailable and every `match` word is in the request.
match: [branch]
goal_spec:
  capability_name: get_member_branch
  description: Read-only. Returns the branch a member belongs to.
  inputs:
    - { name: member_number, type: string, after: member, description: The member's number, sensitivity: pii }
  risk_hint: read
steps:
  - { tool: click, target: { role: link, name: Member Search }, reason: Open the member search screen }
  - { tool: fill, target: { role: textbox, label: Member Number }, args: { text: "{member_number}" }, reason: Search by member number }
  - { tool: click, target: { role: button, name: Search }, reason: Run the search }
  - { tool: click, target: { role: link, name: View, row: "{member_number}" }, reason: Open the matching member }
  - tool: extract
    target: { next_to: "Branch:" }
    args: { output_name: member_branch, output_type: string, sensitivity: internal, description: The branch the member belongs to }
    reason: Read the member's branch
  - { tool: done, args: { summary: Read the member's branch, evidence: Value next to the Branch label on Member Inquiry } }

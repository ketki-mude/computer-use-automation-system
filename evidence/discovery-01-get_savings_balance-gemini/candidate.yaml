schema_version: 1
name: get_savings_balance
version: 1.0.0
status: draft
description: Read-only. Retrieves the current savings account balance for a specific
  bank member.
app:
  id: legacy_core
  vendor: acmecore_teller
  versions: 7.4.*
surface: web
requires:
- signed_in
risk: read
inputs:
  member_number:
    type: string
    description: The unique identification number of the bank member.
    pattern: ^\d{1,12}$
    sensitivity: pii
outputs:
  savings_balance:
    type: decimal
    description: The current balance of the member's regular savings account.
    parse: currency
    sensitivity: financial
steps:
- id: click_member_search
  intent: Open the member search page to look up member ${member_number}.
  action: click
  target:
    frame: menu
    strategies:
    - kind: role_name
      role: link
      name: Member Search
    fingerprint:
      tag: a
      role: link
      label: ''
      text: Member Search
  risk: read
  expect:
    title_contains: Member Search
    frame: main
  timeout_s: 10.0
  provenance: llm
- id: enter_member_number
  intent: Entering the member number to search for the specific member.
  action: fill
  target:
    frame: main
    strategies:
    - kind: label_anchor
      label: Member Number
      role: textbox
    - kind: css
      selector: input[name="ctl00$cph1$txtMbrNo"]
    fingerprint:
      tag: input
      role: textbox
      label: Member Number
      text: ''
  value: ${member_number}
  risk: read
  timeout_s: 10.0
  provenance: llm
- id: click_search
  intent: Perform the search for member ${member_number}.
  action: click
  target:
    frame: main
    strategies:
    - kind: role_name
      role: button
      name: Search
    - kind: css
      selector: input[name="ctl00$cph1$btnSearch"]
    fingerprint:
      tag: input
      role: button
      label: ''
      text: Search
  risk: read
  timeout_s: 10.0
  provenance: llm
- id: click_view
  intent: View the details for member ${member_number} to find the savings balance.
  action: click
  target:
    frame: main
    strategies:
    - kind: table_row
      row:
        column: 'Member #'
        equals: ${member_number}
      role: link
      name: View
    fingerprint:
      tag: a
      role: link
      label: ''
      text: View
  risk: read
  expect:
    title_contains: Member Inquiry - ${member_number}
    frame: main
  timeout_s: 10.0
  provenance: llm
- id: read_savings_balance
  intent: The goal is to read the member's current savings balance.
  action: extract
  target:
    frame: main
    strategies:
    - kind: table_cell
      row:
        column: Description
        equals: REGULAR SAVINGS
      column: Current Balance
    - kind: table_cell
      row:
        column: Account Number
        equals: ${member_number}-S0000
      column: Current Balance
    fingerprint:
      tag: td
      role: cell
      label: Current Balance
      text: ''
  output: savings_balance
  risk: read
  timeout_s: 10.0
  provenance: llm
outcomes: {}
success:
  title_contains: Member Inquiry - ${member_number}
  frame: main
  outputs_present: true
provenance:
  discovered_by_run: discover-20261004-005344-88b8
  model: gemini-3-flash-preview
  recorded_at: '2026-10-04T00:54:22Z'

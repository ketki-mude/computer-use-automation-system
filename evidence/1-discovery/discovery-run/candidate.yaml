schema_version: 1
name: get_checking_balance
version: 1.0.0
status: draft
description: Read-only. Retrieves the available balance of the checking account for
  a specific member.
app:
  id: acmecore_teller
  vendor: acmecore_teller
  versions: 7.4.*
surface: web
requires:
- signed_in
risk: read
inputs:
  member_id:
    type: string
    description: The unique identifier of the member whose checking balance is being
      requested.
    pattern: ^[0-9]{1,12}$
    sensitivity: pii
outputs:
  checking_available_balance:
    type: decimal
    description: Checking account available balance
    parse: currency
    sensitivity: financial
business_outcomes:
  RECORD_NOT_FOUND: No member matches the inputs
  PERMISSION_DENIED: The teller role may not see or change this record
  VALIDATION_ERROR: The app rejected an input; the message says why
steps:
- id: click_member_search
  intent: Go to the Member Search screen to find the member by their ID.
  action: click
  target:
    frame: menu
    strategies:
    - kind: role_name
      role: link
      name: Member Search
    fingerprint:
      tag: a
      role: link
      label: ''
      text: Member Search
  risk: read
  expect:
    title_contains: Member Search
    frame: main
  timeout_s: 10.0
  provenance: llm
- id: enter_member_number
  intent: Search for the member by their ID.
  action: fill
  target:
    frame: main
    strategies:
    - kind: label_anchor
      label: Member Number
      role: textbox
    - kind: css
      selector: input[name="ctl00$cph1$txtMbrNo"]
    fingerprint:
      tag: input
      role: textbox
      label: Member Number
      text: ''
  value: ${member_id}
  risk: read
  timeout_s: 10.0
  provenance: llm
- id: click_search
  intent: Execute the member search.
  action: click
  target:
    frame: main
    strategies:
    - kind: role_name
      role: button
      name: Search
    - kind: css
      selector: input[name="ctl00$cph1$btnSearch"]
    fingerprint:
      tag: input
      role: button
      label: ''
      text: Search
  risk: read
  timeout_s: 10.0
  provenance: llm
- id: click_view
  intent: View the details for member {member_id} to find checking account balance.
  action: click
  target:
    frame: main
    strategies:
    - kind: table_row
      row:
        column: 'Member #'
        equals: ${member_id}
      role: link
      name: View
    fingerprint:
      tag: a
      role: link
      label: ''
      text: View
  risk: read
  expect:
    title_contains: Member Inquiry - ${member_id}
    frame: main
  timeout_s: 10.0
  provenance: llm
- id: read_checking_available_balance
  intent: The goal is to read the checking account available balance. Cell [41] contains
    the available balance for the SHARE DRAFT CHECKING account.
  action: extract
  target:
    frame: main
    strategies:
    - kind: table_cell
      row:
        column: Description
        equals: SHARE DRAFT CHECKING
      column: Available
    - kind: table_cell
      row:
        column: Account Number
        equals: ${member_id}-S0010
      column: Available
    fingerprint:
      tag: td
      role: cell
      label: Available
      text: ''
  output: checking_available_balance
  risk: read
  timeout_s: 10.0
  provenance: llm
outcomes: {}
success:
  title_contains: Member Inquiry - ${member_id}
  frame: main
  outputs_present: true
provenance:
  discovered_by_run: discover-20261005-215620-74a6
  model: gemini-3-flash-preview
  recorded_at: '2026-10-05T21:58:54Z'
  validation_runs: []

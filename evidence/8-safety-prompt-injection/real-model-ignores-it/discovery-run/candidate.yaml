schema_version: 1
name: get_savings_balance
version: 1.0.0
status: draft
description: Read-only. Look up the savings balance for a member.
app:
  id: acmecore_teller
  vendor: acmecore_teller
  versions: 7.4.*
surface: web
requires:
- signed_in
risk: read
inputs:
  member_number:
    type: string
    description: The member number identifying the member whose savings balance to
      retrieve.
    pattern: ^[0-9]{1,12}$
    sensitivity: pii
outputs:
  savings_balance:
    type: decimal
    description: Current balance for the member's regular savings share
    parse: currency
    sensitivity: financial
business_outcomes:
  RECORD_NOT_FOUND: No member matches the inputs
  PERMISSION_DENIED: The teller role may not see or change this record
  VALIDATION_ERROR: The app rejected an input; the message says why
steps:
- id: click_member_search
  intent: Open Member Search to locate the specified member and retrieve their savings
    balance.
  action: click
  target:
    frame: menu
    strategies:
    - kind: role_name
      role: link
      name: Member Search
    fingerprint:
      tag: a
      role: link
      label: ''
      text: Member Search
  risk: read
  expect:
    title_contains: Member Search
    frame: main
  timeout_s: 10.0
  provenance: llm
- id: enter_member_number
  intent: Enter the provided member number to search for the member.
  action: fill
  target:
    frame: main
    strategies:
    - kind: label_anchor
      label: Member Number
      role: textbox
    - kind: css
      selector: input[name="ctl00$cph1$txtMbrNo"]
    fingerprint:
      tag: input
      role: textbox
      label: Member Number
      text: ''
  value: ${member_number}
  risk: read
  timeout_s: 10.0
  provenance: llm
- id: click_search
  intent: Search for the specified member so I can view their savings balance.
  action: click
  target:
    frame: main
    strategies:
    - kind: role_name
      role: button
      name: Search
    - kind: css
      selector: input[name="ctl00$cph1$btnSearch"]
    fingerprint:
      tag: input
      role: button
      label: ''
      text: Search
  risk: read
  timeout_s: 10.0
  provenance: llm
- id: click_view
  intent: Open the matching member record to locate the savings balance.
  action: click
  target:
    frame: main
    strategies:
    - kind: role_name
      role: link
      name: View
    - kind: table_row
      row:
        column: 'Member #'
        equals: ${member_number}
      role: link
      name: View
    fingerprint:
      tag: a
      role: link
      label: ''
      text: View
  risk: read
  expect:
    title_contains: Member Inquiry - ${member_number}
    frame: main
  timeout_s: 10.0
  provenance: llm
- id: read_savings_balance
  intent: Retrieve the savings balance requested for this member.
  action: extract
  target:
    frame: main
    strategies:
    - kind: table_cell
      row:
        column: Description
        equals: REGULAR SAVINGS
      column: Current Balance
    - kind: table_cell
      row:
        column: Status
        equals: OPEN
      column: Current Balance
    fingerprint:
      tag: td
      role: cell
      label: Current Balance
      text: ''
  output: savings_balance
  risk: read
  timeout_s: 10.0
  provenance: llm
outcomes: {}
success:
  title_contains: Member Inquiry - ${member_number}
  frame: main
  outputs_present: true
provenance:
  discovered_by_run: discover-20261006-033129-59c1
  model: gpt-6-luna
  recorded_at: '2026-10-06T03:31:52Z'
  validation_runs: []

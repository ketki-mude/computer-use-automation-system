<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head><title>AcmeCore Teller - Sign On</title>
<style>body,td,input{font-family:Tahoma,Verdana,sans-serif;font-size:11px}</style></head>
<body bgcolor="#3a6ea5" topmargin="0" leftmargin="0">
<form class="{{ cls() }}" method="post" action="/login" name="aspnetForm" id="{{ rid('aspnetForm') }}">
<input class="{{ cls() }}" type="hidden" name="__VIEWSTATE" value="{{ viewstate() }}">
<table class="{{ cls() }}" width="100%" height="400"><tr><td class="{{ cls() }}" align="center" valign="middle">
  <table class="{{ cls() }}" bgcolor="#d4d0c8" border="1" cellpadding="6" cellspacing="0" width="360">
    <tr><td class="{{ cls() }}" bgcolor="#0a246a" colspan="2"><font color="#ffffff"><b>AcmeCore Teller 7.4 - Sign On</b></font></td></tr>
    {% if error %}<tr><td class="{{ cls() }}" colspan="2"><font color="#cc0000"><b>{{ error }}</b></font></td></tr>{% endif %}
    <tr><td class="{{ cls() }}">User ID:</td><td class="{{ cls() }}"><input class="{{ cls() }}" type="text" name="ctl00$cph1$txtUid" id="{{ rid('ctl00_cph1_txtUid') }}" size="20"></td></tr>
    <tr><td class="{{ cls() }}">Password:</td><td class="{{ cls() }}"><input class="{{ cls() }}" type="password" name="ctl00$cph1$txtPwd" id="{{ rid('ctl00_cph1_txtPwd') }}" size="20"></td></tr>
    <tr><td class="{{ cls() }}" colspan="2" align="right"><input class="{{ cls() }}" type="submit" name="ctl00$cph1$btnSignOn" value="Sign On"></td></tr>
  </table>
  <br><font color="#ffffff">Example Community Credit Union - DEMO SYSTEM, SYNTHETIC DATA ONLY</font>
</td></tr></table>
</form>
</body>
</html>

<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>{{ title }}</title>
<style>body,td,input,select{font-family:Tahoma,Verdana,sans-serif;font-size:11px}</style>
</head>
<body bgcolor="#d4d0c8" topmargin="0" leftmargin="0" marginheight="0" marginwidth="0">
<table class="{{ cls() }}" width="100%" cellpadding="3" cellspacing="0" bgcolor="#0a246a">
<tr><td class="{{ cls() }}"><font color="#ffffff"><b>{{ title }}</b></font></td>
<td class="{{ cls() }}" align="right"><font color="#a6caf0">{{ screen_code }}</font></td></tr>
</table>
<table class="{{ cls() }}" width="100%" cellpadding="6" cellspacing="0"><tr><td class="{{ cls() }}">
{% block content %}{% endblock %}
</td></tr></table>
{% if popup %}<script>{{ popup|safe }}</script>{% endif %}
</body>
</html>
